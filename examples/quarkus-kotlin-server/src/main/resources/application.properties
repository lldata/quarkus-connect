quarkus.application.name=quarkus-kotlin-server
quarkus.http.port=8080
# Uber-jar for interopMatrix (scripts/run-interop-matrix.sh) without a nested Gradle -D.
quarkus.package.jar.type=uber-jar
# One port: native gRPC (h2) + Connect + gRPC-Web share the Quarkus HTTP server
quarkus.grpc.server.use-separate-server=false

# Demo CORS for Flutter web / other origins. Production: pin exact origins (see docs/INGRESS.md).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=accept,authorization,content-type,connect-protocol-version,connect-timeout-ms,grpc-timeout,x-grpc-web,x-user-agent,range
quarkus.http.cors.methods=GET,POST,OPTIONS,HEAD
quarkus.http.cors.exposed-headers=content-range,accept-ranges,content-length,content-type

# Prefer gzip for JSON Connect responses when the client asks.
quarkus.http.enable-compression=true
quarkus.http.compress-media-types=application/json,application/proto,text/plain

# OpenTelemetry (spans from RpcTracingInterceptor; export optional)
quarkus.otel.traces.exporter=none
quarkus.otel.metrics.exporter=none

# Chunked upload storage
demo.media.dir=${java.io.tmpdir}/quarkus-connect-media
