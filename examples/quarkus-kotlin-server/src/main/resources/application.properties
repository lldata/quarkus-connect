quarkus.application.name=quarkus-kotlin-server
quarkus.http.port=8080
# One port: native gRPC (h2) + Connect + gRPC-Web share the Quarkus HTTP server
quarkus.grpc.server.use-separate-server=false

# Demo CORS for Flutter web (other origin). Tighten for production.
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=accept,authorization,content-type,connect-protocol-version,connect-timeout-ms,grpc-timeout,x-grpc-web,x-user-agent
quarkus.http.cors.methods=GET,POST,OPTIONS
