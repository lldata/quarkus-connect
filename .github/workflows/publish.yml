name: Publish

# Tag-driven Central Portal upload + draft GitHub release.
# Fail-closed without SIGNING_* / MAVEN_CENTRAL_* secrets (house style).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+**"]

jobs:
  publish:
    runs-on: ubuntu-latest

    # Only the canonical repository holds the publishing secrets.
    if: github.repository == 'lldata/quarkus-connect'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Signing turns itself on when a key is present, so a missing secret would otherwise upload
      # an unsigned bundle and be rejected minutes later by the Portal.
      - name: Require the publishing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          missing=""
          for name in SIGNING_KEY SIGNING_PASSWORD MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::No value for repository secret(s):$missing"
            exit 1
          fi

      - name: Resolve the version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the committed version
        env:
          TAGGED: ${{ steps.version.outputs.version }}
        run: |
          committed=$(sed -n 's/^version=//p' gradle.properties)
          if [ "$committed" != "$TAGGED" ]; then
            echo "::error::Tag v$TAGGED does not match gradle.properties version $committed"
            exit 1
          fi

      - name: Build
        run: ./gradlew check --no-daemon --no-parallel

      # Uploads a bundle to the Central Portal; it does NOT release to Maven Central.
      # Credentials as env vars — never `-P` flags (process table / echoed Run line).
      - name: Publish to the Central Portal
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew publishToMavenCentral | tee publish.log

      - name: Report the deployment status
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          id=$(sed -n 's/.*deployment id: \([0-9a-f-]*\).*/\1/p' publish.log | head -1)
          if [ -z "$id" ]; then
            echo "::error::The publish step reported no deployment id."
            exit 1
          fi

          token=$(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w0)
          echo "::add-mask::$token"

          state_of='import json,sys; print(json.load(sys.stdin).get("deploymentState",""))'
          errors_of='import json,sys; d=json.load(sys.stdin); e=d.get("errors") or d.get("deploymentErrors"); print(json.dumps(e or d, indent=2))'

          for _ in $(seq 1 20); do
            body=$(curl -sS -X POST -H "Authorization: Bearer $token" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$id")
            state=$(printf '%s' "$body" | python3 -c "$state_of")
            echo "deployment $id: ${state:-unknown}"
            case "$state" in
              VALIDATED|PUBLISHED)
                echo "::notice::Deployment $state — publish it at https://central.sonatype.com/publishing"
                exit 0
                ;;
              FAILED)
                echo "::error::Deployment failed validation. The Portal gave this reason:"
                printf '%s' "$body" | python3 -c "$errors_of"
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "::warning::Still ${state:-unknown} after five minutes; check the Portal."

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --draft
          --title "${{ steps.version.outputs.version }}"
          runtime/build/libs/*.jar
          deployment/build/libs/*.jar
