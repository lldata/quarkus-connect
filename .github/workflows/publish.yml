name: Publish

# Manual / AI only. Promotes the newest main SNAPSHOT Maven artifact (already
# built and uploaded by CI) to a release version — no compile/test/package.
# Secrets live on GitHub Environment `publish`.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to publish the newest main SNAPSHOT to Central'
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest

    if: >-
      github.repository == 'lldata/quarkus-connect'
      && github.event.inputs.confirm == 'promote'

    environment: publish

    permissions:
      contents: write
      actions: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve newest snapshot on main
        id: ver
        run: |
          set -euo pipefail
          snapshot=$(sed -n 's/^version=//p' gradle.properties)
          if [[ "$snapshot" != *-SNAPSHOT ]]; then
            echo "::error::main version is '$snapshot'; expected a *-SNAPSHOT to promote"
            exit 1
          fi
          release="${snapshot%-SNAPSHOT}"
          if git rev-parse "v${release}" >/dev/null 2>&1; then
            echo "::error::tag v${release} already exists — refusing to re-release"
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          {
            echo "snapshot=$snapshot"
            echo "release=$release"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"
          echo "Promoting $snapshot → $release at $sha"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Require the publishing secrets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          missing=""
          for name in SIGNING_KEY SIGNING_PASSWORD MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::No value for Environment 'publish' secret(s):$missing"
            echo "::error::Set them under Settings → Environments → publish (or gh secret set --env publish)."
            exit 1
          fi

      - name: Download newest CI snapshot artifact for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.ver.outputs.sha }}
          SNAPSHOT: ${{ steps.ver.outputs.snapshot }}
        run: |
          set -euo pipefail
          # Exact commit — never an older main build.
          run_id=$(gh run list \
            --repo "${{ github.repository }}" \
            --branch main \
            --commit "$SHA" \
            --workflow CI \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful CI run for main@$SHA. Wait for CI to stage snapshot-maven-repo."
            exit 1
          fi
          echo "Using CI run $run_id for $SHA"
          mkdir -p "$RUNNER_TEMP/dl"
          gh run download "$run_id" \
            --repo "${{ github.repository }}" \
            --name snapshot-maven-repo \
            --dir "$RUNNER_TEMP/dl"
          tgz=$(find "$RUNNER_TEMP/dl" -name 'snapshot-maven-repo.tgz' -print -quit)
          [[ -n "$tgz" ]] || {
            echo "::error::CI run $run_id has no snapshot-maven-repo.tgz"
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/snapshot-repo"
          tar -C "$RUNNER_TEMP/snapshot-repo" -xzf "$tgz"
          got=$(tr -d '[:space:]' <"$RUNNER_TEMP/snapshot-repo/SNAPSHOT_VERSION")
          art_sha=$(tr -d '[:space:]' <"$RUNNER_TEMP/snapshot-repo/GIT_SHA")
          if [[ "$got" != "$SNAPSHOT" ]]; then
            echo "::error::Artifact SNAPSHOT_VERSION=$got does not match main $SNAPSHOT"
            exit 1
          fi
          if [[ "$art_sha" != "$SHA" ]]; then
            echo "::error::Artifact GIT_SHA=$art_sha does not match main $SHA"
            exit 1
          fi
          echo "SNAPSHOT_REPO=$RUNNER_TEMP/snapshot-repo" >> "$GITHUB_ENV"

      - name: Import signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          # Pin the secret key for non-interactive detach-sign.
          key_id=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          echo "GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"
          printf '%s\n' "$SIGNING_PASSWORD" >"$RUNNER_TEMP/gpg-pass"
          echo "GPG_PASSPHRASE_FILE=$RUNNER_TEMP/gpg-pass" >> "$GITHUB_ENV"

      - name: Promote snapshot repo to release (no rebuild)
        id: promote
        env:
          SNAPSHOT: ${{ steps.ver.outputs.snapshot }}
          RELEASE: ${{ steps.ver.outputs.release }}
        run: |
          set -euo pipefail
          # Wrap gpg so the promote script signs with the imported key + passphrase.
          export PATH="$RUNNER_TEMP/bin:$PATH"
          mkdir -p "$RUNNER_TEMP/bin"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'exec /usr/bin/gpg --batch --yes --pinentry-mode loopback \' \
            '  --passphrase-file "${GPG_PASSPHRASE_FILE}" \' \
            '  --local-user "${GPG_KEY_ID}" "$@"' \
            >"$RUNNER_TEMP/bin/gpg"
          chmod +x "$RUNNER_TEMP/bin/gpg"

          out="$RUNNER_TEMP/promoted"
          ./scripts/promote-snapshot-repo.sh \
            --snapshot-repo "$SNAPSHOT_REPO" \
            --snapshot-version "$SNAPSHOT" \
            --release-version "$RELEASE" \
            --out-dir "$out"
          echo "bundle=$out/central-bundle.zip" >> "$GITHUB_OUTPUT"
          echo "jars=$out/jars" >> "$GITHUB_OUTPUT"

      - name: Upload promoted bundle to Central Portal
        id: upload
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          RELEASE: ${{ steps.ver.outputs.release }}
          BUNDLE: ${{ steps.promote.outputs.bundle }}
        run: |
          set -euo pipefail
          token=$(printf '%s:%s' "$USERNAME" "$PASSWORD" | base64 -w0)
          echo "::add-mask::$token"
          name="io.github.lldata:quarkus-connect:${RELEASE}"
          id=$(curl -sS -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@${BUNDLE};type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=$(printf %s "$name" | jq -sRr @uri)&publishingType=USER_MANAGED")
          if [[ ! "$id" =~ ^[0-9a-f-]+$ ]]; then
            echo "::error::Portal upload did not return a deployment id: $id"
            exit 1
          fi
          echo "deployment_id=$id" >> "$GITHUB_OUTPUT"
          echo "PORTAL_TOKEN=$token" >> "$GITHUB_ENV"
          echo "Uploaded deployment $id"

      - name: Report the deployment status
        env:
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment_id }}
        run: |
          set -euo pipefail
          state_of='import json,sys; print(json.load(sys.stdin).get("deploymentState",""))'
          errors_of='import json,sys; d=json.load(sys.stdin); e=d.get("errors") or d.get("deploymentErrors"); print(json.dumps(e or d, indent=2))'
          for _ in $(seq 1 20); do
            body=$(curl -sS -X POST -H "Authorization: Bearer $PORTAL_TOKEN" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID")
            state=$(printf '%s' "$body" | python3 -c "$state_of")
            echo "deployment $DEPLOYMENT_ID: ${state:-unknown}"
            case "$state" in
              VALIDATED|PUBLISHED)
                echo "::notice::Deployment $state — publish it at https://central.sonatype.com/publishing"
                exit 0
                ;;
              FAILED)
                echo "::error::Deployment failed validation. The Portal gave this reason:"
                printf '%s' "$body" | python3 -c "$errors_of"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::warning::Still ${state:-unknown} after five minutes; check the Portal."

      - name: Tag the promoted commit and draft the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ steps.ver.outputs.release }}
          SHA: ${{ steps.ver.outputs.sha }}
          SNAPSHOT: ${{ steps.ver.outputs.snapshot }}
          JARS: ${{ steps.promote.outputs.jars }}
        run: |
          set -euo pipefail
          tag="v${RELEASE}"
          git tag -a "$tag" "$SHA" -m "Release ${RELEASE} (promoted from ${SNAPSHOT})"
          git push origin "$tag"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "Promoted \`${SNAPSHOT}\` at \`${SHA}\` to Maven coordinates"
            echo "\`io.github.lldata:quarkus-connect:${RELEASE}\` (no rebuild)."
            echo
            echo "Central Portal deployment is **USER_MANAGED** — press Publish at"
            echo "https://central.sonatype.com/publishing when ready."
            echo
            echo "## Changelog"
            echo
            if grep -q "^## \\[${RELEASE}\\]" CHANGELOG.md; then
              awk -v ver="$RELEASE" '
                $0 ~ "^## \\[" ver "\\]" {p=1; next}
                p && /^## / {exit}
                p {print}
              ' CHANGELOG.md
            else
              awk '
                /^## \[Unreleased\]/ {p=1; next}
                p && /^## / {exit}
                p {print}
              ' CHANGELOG.md
            fi
          } >"$notes"
          gh release create "$tag" \
            --draft \
            --title "quarkus-connect ${RELEASE}" \
            --notes-file "$notes" \
            "$JARS"/*.jar

      - name: Open post-release SNAPSHOT bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ steps.ver.outputs.release }}
          SNAPSHOT: ${{ steps.ver.outputs.snapshot }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -euo pipefail
          # Next patch SNAPSHOT after the promoted release (0.1.7 → 0.1.8-SNAPSHOT).
          IFS=. read -r maj min pat <<<"$RELEASE"
          next="${maj}.${min}.$((pat + 1))-SNAPSHOT"
          branch="cursor/post-release-${RELEASE}-a260"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch" "$SHA"
          today=$(date -u +%F)
          # gradle.properties: record released line then move main to next SNAPSHOT.
          sed -i "s/^version=.*/version=${next}/" gradle.properties
          # CHANGELOG: fold Unreleased into [RELEASE], start new Unreleased for next.
          python3 - "$RELEASE" "$next" "$today" <<'PY'
          import pathlib, sys
          release, nxt, today = sys.argv[1], sys.argv[2], sys.argv[3]
          path = pathlib.Path("CHANGELOG.md")
          text = path.read_text()
          marker = "## [Unreleased]\n"
          if marker not in text:
              raise SystemExit("CHANGELOG.md missing ## [Unreleased]")
          pre, rest = text.split(marker, 1)
          if rest.startswith("\n"):
              rest = rest[1:]
          body, sep, after = rest.partition("\n## ")
          body = body.rstrip() + "\n"
          new = (
              pre
              + marker
              + "\n"
              + "### Changed\n"
              + f"- Development continues on `{nxt}` after the `{release}` release\n"
              + "\n"
              + f"## [{release}] - {today}\n"
              + "\n"
              + f"Promoted from `{release}-SNAPSHOT` (CI snapshot artifact; Publish workflow, no rebuild).\n"
              + "\n"
              + body
          )
          if sep:
              new += sep + after
          path.write_text(new)
          PY
          git add gradle.properties CHANGELOG.md
          git commit -m "Bump to ${next} after v${RELEASE}"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Bump to ${next} after v${RELEASE}" \
            --body "$(printf '%s\n' \
              "## Summary" \
              "- Post-release bump after Publish promoted \`${SNAPSHOT}\` → \`${RELEASE}\` (tag \`v${RELEASE}\`)." \
              "- No Central publish in this PR; CI only." \
              "" \
              "## Test plan" \
              "- [ ] CI green → squash-merge")" \
            || echo "::notice::PR may already exist for $branch"
