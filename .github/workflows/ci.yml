name: CI

on:
  push:
    branches: [main]
  pull_request:

# Build floor is JDK 21 (toolchain); library bytecode targets JVM 17.
# House style: lldata/quarkus-kotlin-typescript-rest-client-generator
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew check --no-daemon
