# Feature matrix for quarkus-connect ConformanceService host.
# Skips TLS, message-receive limits, gRPC+JSON, and full-duplex bidi (buffered path).
# See docs/INTEROP.md for the skip rationale and known-failing patterns.
features:
  versions:
    - HTTP_VERSION_1
    - HTTP_VERSION_2
  protocols:
    - PROTOCOL_CONNECT
    - PROTOCOL_GRPC
    - PROTOCOL_GRPC_WEB
  codecs:
    - CODEC_PROTO
    - CODEC_JSON
  compressions:
    - COMPRESSION_IDENTITY
    - COMPRESSION_GZIP
  stream_types:
    - STREAM_TYPE_UNARY
    - STREAM_TYPE_CLIENT_STREAM
    - STREAM_TYPE_SERVER_STREAM
    - STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
  supportsH2c: true
  supportsTls: false
  supportsTlsClientCerts: false
  supportsTrailers: true
  supportsHalfDuplexBidiOverHttp1: true
  supportsConnectGet: true
  supportsMessageReceiveLimit: false

# Native gRPC is protobuf-on-HTTP/2; Connect JSON is not a gRPC wire codec.
exclude_cases:
  - protocol: PROTOCOL_GRPC
    codec: CODEC_JSON
