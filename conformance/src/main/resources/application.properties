quarkus.application.name=quarkus-connect-conformance
# Port / host set by ConformanceMain before Quarkus boots (ephemeral).
quarkus.grpc.server.use-separate-server=false
quarkus.package.jar.type=uber-jar
quarkus.package.output-name=quarkus-connect-conformance

# ServerCompatResponse must be the only stdout payload.
quarkus.banner.enabled=false
quarkus.log.console.stderr=true
quarkus.log.level=WARN
quarkus.log.category."io.github.lldata.connect".level=INFO
