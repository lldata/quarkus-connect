# Quarkus / Kotlin — Gradle 9.8.1 (house style) needs Quarkus 3.20+; align near reference (3.38).
quarkusVersion=3.38.0
kotlinVersion=2.4.21
protobufVersion=4.29.3

# Coordinates
group=io.github.lldata
version=0.1.5

# House style (mirror of lldata/quarkus-kotlin-typescript-rest-client-generator):
# build runs on JDK 21 toolchain; published/library bytecode targets JVM 17.
jdkToolchainVersion=21
jvmTargetVersion=17

org.gradle.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
