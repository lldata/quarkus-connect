quarkus.grpc.server.use-separate-server=false
# Random ports — avoid clashing with sibling IT modules under `./gradlew check`.
quarkus.http.port=0
quarkus.http.test-port=0

# Embedded basic auth — activates Quarkus Security capability for this module only.
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.alice=alice
quarkus.security.users.embedded.roles.alice=user
quarkus.security.users.embedded.users.admin=admin
quarkus.security.users.embedded.roles.admin=admin,user
