syntax = "proto3";

package greet.v1;

option java_multiple_files = true;
option java_package = "io.github.lldata.connect.it.greet.v1";
option java_outer_classname = "GreetProto";

service GreetService {
  // NO_SIDE_EFFECTS → Connect unary GET (connect-go parity).
  rpc Greet(GreetRequest) returns (GreetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc Fail(FailRequest) returns (FailResponse);
  rpc FailWithDetails(FailRequest) returns (FailResponse);
  rpc Slow(GreetRequest) returns (GreetResponse);
  // Connect server streaming (`application/connect+json|proto`)
  rpc StreamGreetings(GreetRequest) returns (stream GreetResponse);

  rpc CollectGreetings(stream GreetRequest) returns (GreetResponse);
  // Connect bidi streaming (`application/connect+json|proto`)
  rpc ChatGreetings(stream GreetRequest) returns (stream GreetResponse);
}

message GreetRequest {
  string name = 1;
  int64 request_id = 2;
}

message GreetResponse {
  string greeting = 1;
  int64 request_id = 2;
}

message FailRequest {
  string code = 1;
  string message = 2;
}

message FailResponse {
  string unused = 1;
}
